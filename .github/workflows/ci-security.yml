name: CI Security and Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Create example env files (CI-only, untracked)
        run: |
          # Create sanitized example env files so security checks can read required keys
          mkdir -p backend
          printf 'ADMIN_UIDS=\nFIREBASE_CREDENTIALS_PATH=backend/serviceAccountKey.json\nRATE_LIMIT_WINDOW_SECONDS=60\nRATE_LIMIT_READ_MAX=100\nRATE_LIMIT_WRITE_MAX=10\n' > backend/.env.example
          mkdir -p frontend
          printf 'VITE_API_BASE_URL=http://localhost:8000/api/v1\nVITE_FIREBASE_API_KEY=ci-placeholder\nVITE_FIREBASE_AUTH_DOMAIN=ci-placeholder.firebaseapp.com\nVITE_FIREBASE_PROJECT_ID=ci-placeholder\n' > frontend/.env.example

      - name: Backend syntax compile
        run: python -m compileall backend
      - name: Security baseline verify
        run: python backend/scripts/security_verify.py --ci


      - name: Backend auth tests
        run: python -m unittest discover -s backend/tests -v

      - name: Monitoring smoke tests
        run: python -m unittest discover -s backend/tests -p "test_monitoring_smoke.py" -v

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://localhost:8000/api/v1' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'ci-placeholder' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'ci-placeholder.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'ci-placeholder' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'ci-placeholder.appspot.com' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:000000000000:web:placeholder' }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID || 'G-PLACEHOLDER' }}
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run build


  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

